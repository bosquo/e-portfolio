<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Gaussian Splat Viewer — Digital Twin iDEAS:lab</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #161F1B;
      color: #FAF9F6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #viewer-container {
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .viewer-status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      background: #161F1B;
      z-index: 20;
      transition: opacity 0.35s ease;
    }

    .viewer-status.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(231, 241, 236, 0.2);
      border-top-color: #84B59C;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 0.9rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-title {
      font-size: 0.96rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #FAF9F6;
    }

    .status-sub {
      font-size: 0.82rem;
      color: #A5B5AD;
      max-width: 460px;
      line-height: 1.5;
    }

    .viewer-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .viewer-btn {
      background: rgba(22, 31, 27, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #FAF9F6;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.38rem 0.68rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .viewer-btn:hover {
      background: rgba(45, 106, 79, 0.85);
      border-color: rgba(132, 181, 156, 0.5);
    }

    .controls-hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(22, 31, 27, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E7F1EC;
      font-size: 0.74rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="viewer-container">
    <div class="viewer-status" id="viewer-status">
      <div class="spinner" id="status-spinner"></div>
      <div class="status-title" id="status-title">Loading 3D Gaussian Splat (2.5M Gaussians)…</div>
      <div class="status-sub" id="status-sub">Downloading 35 MB .sog model · Digital Twin iDEAS:lab (260k iterations, MRNF)</div>
    </div>

    <div class="viewer-toolbar">
      <button class="viewer-btn" id="btn-reset" title="Reset camera to starting view">Reset View</button>
      <button class="viewer-btn" id="btn-copy-pov" title="Copy current camera coordinates">Copy POV</button>
      <button class="viewer-btn" id="btn-fullscreen" title="Toggle fullscreen">Fullscreen</button>
    </div>

    <div class="controls-hint">Left-drag: Orbit · Right-drag: Pan · Scroll: Zoom · WASD / Arrows: Fly</div>
  </div>

  <script type="module">
    const container = document.getElementById('viewer-container');
    const statusBox = document.getElementById('viewer-status');
    const spinner = document.getElementById('status-spinner');
    const statusTitle = document.getElementById('status-title');
    const statusSub = document.getElementById('status-sub');

    const SOG_FILE = './completeModel_2.5M_Gaussians_260k_iterations_MRNF.sog';

    if (window.location.protocol === 'file:') {
      spinner.style.display = 'none';
      statusTitle.textContent = 'Interactive 3D Splat Viewer Requires HTTP/HTTPS';
      statusSub.innerHTML = 'Browsers block streaming <code>.sog</code> WebGL/WebGPU assets over local <code>file://</code> URLs. Open your live <strong>GitHub Pages</strong> site (or a local web server) to interact with the 3D Gaussian Splat.';
    } else {
      initPlayCanvasSplat();
    }

    async function initPlayCanvasSplat() {
      try {
        let pc;
        try {
          pc = await import('https://cdn.jsdelivr.net/npm/playcanvas@2/build/playcanvas.mjs');
        } catch {
          pc = await import('https://unpkg.com/playcanvas@2/build/playcanvas.mjs');
        }

        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        const app = new pc.Application(canvas, {
          graphicsDeviceOptions: {
            antialias: false,
            alpha: false,
            powerPreference: 'high-performance'
          }
        });

        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        app.graphicsDevice.maxPixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        app.start();

        window.addEventListener('resize', () => app.resizeCanvas());

        // Create Camera Entity
        const camera = new pc.Entity('Camera');
        camera.addComponent('camera', {
          clearColor: new pc.Color(0.086, 0.122, 0.106),
          fov: 60,
          nearClip: 0.05,
          farClip: 100
        });
        app.root.addChild(camera);

        // Orbit & Fly Camera State
        // Room bounds in world space (after 180° Z flip):
        // X: [-2.4, +5.1], Y: [+1.55 (floor) to +4.30 (ceiling)], Z: [-4.9, +5.0]
        const defaultState = {
          yaw: 25,
          pitch: -8,
          distance: 1.4,
          target: new pc.Vec3(1.2, 2.65, -0.5)
        };

        let yaw = defaultState.yaw;
        let pitch = defaultState.pitch;
        let distance = defaultState.distance;
        const target = defaultState.target.clone();

        function updateCameraTransform() {
          pitch = Math.max(-88, Math.min(88, pitch));
          distance = Math.max(0.15, Math.min(18, distance));

          const pitchRad = pitch * pc.math.DEG_TO_RAD;
          const yawRad = yaw * pc.math.DEG_TO_RAD;

          const x = target.x + distance * Math.cos(pitchRad) * Math.sin(yawRad);
          const y = target.y - distance * Math.sin(pitchRad);
          const z = target.z + distance * Math.cos(pitchRad) * Math.cos(yawRad);

          camera.setPosition(x, y, z);
          camera.lookAt(target);
        }

        updateCameraTransform();

        // Pointer Controls (Orbit + Pan)
        let isDragging = false;
        let dragMode = 'orbit'; // 'orbit' or 'pan'
        let lastX = 0;
        let lastY = 0;

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        canvas.addEventListener('pointerdown', (e) => {
          isDragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          dragMode = (e.button === 2 || e.button === 1 || e.shiftKey) ? 'pan' : 'orbit';
          canvas.setPointerCapture(e.pointerId);
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          if (dragMode === 'orbit') {
            yaw -= dx * 0.32;
            pitch -= dy * 0.32;
          } else {
            const panSpeed = distance * 0.0018;
            const right = camera.right.clone().mulScalar(-dx * panSpeed);
            const up = camera.up.clone().mulScalar(dy * panSpeed);
            target.add(right).add(up);
          }
          updateCameraTransform();
        });

        canvas.addEventListener('pointerup', (e) => {
          isDragging = false;
          try { canvas.releasePointerCapture(e.pointerId); } catch {}
        });

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
          distance *= zoomFactor;
          updateCameraTransform();
        }, { passive: false });

        // Keyboard Fly Controls (WASD / Arrow Keys)
        const keys = new Set();
        window.addEventListener('keydown', (e) => keys.add(e.code));
        window.addEventListener('keyup', (e) => keys.delete(e.code));

        app.on('update', (dt) => {
          if (keys.size === 0) return;
          const moveSpeed = Math.max(1.2, distance * 0.75) * dt;
          const forward = camera.forward.clone();
          const right = camera.right.clone();
          const up = pc.Vec3.UP;

          if (keys.has('KeyW') || keys.has('ArrowUp')) target.add(forward.clone().mulScalar(moveSpeed));
          if (keys.has('KeyS') || keys.has('ArrowDown')) target.add(forward.clone().mulScalar(-moveSpeed));
          if (keys.has('KeyD') || keys.has('ArrowRight')) target.add(right.clone().mulScalar(moveSpeed));
          if (keys.has('KeyA') || keys.has('ArrowLeft')) target.add(right.clone().mulScalar(-moveSpeed));
          if (keys.has('KeyE')) target.add(up.clone().mulScalar(moveSpeed));
          if (keys.has('KeyQ')) target.add(up.clone().mulScalar(-moveSpeed));

          updateCameraTransform();
        });

        // Load .sog Asset
        const splatAsset = new pc.Asset('ideaslab-splat', 'gsplat', {
          url: SOG_FILE
        });

        splatAsset.on('load', () => {
          const splatEntity = new pc.Entity('iDEASLabSplat');
          splatEntity.addComponent('gsplat', {
            asset: splatAsset
          });
          // Standard COLMAP / 3DGS orientation flip so room is right-side up
          splatEntity.setLocalEulerAngles(0, 0, 180);
          app.root.addChild(splatEntity);

          statusBox.classList.add('hidden');
        });

        splatAsset.on('error', (err) => {
          spinner.style.display = 'none';
          statusTitle.textContent = 'Failed to load .sog Gaussian Splat';
          statusSub.textContent = String(err || 'Could not decode .sog file.');
        });

        app.assets.add(splatAsset);
        app.assets.load(splatAsset);

        // Toolbar Buttons
        document.getElementById('btn-reset').addEventListener('click', () => {
          yaw = defaultState.yaw;
          pitch = defaultState.pitch;
          distance = defaultState.distance;
          target.copy(defaultState.target);
          updateCameraTransform();
        });

        const copyBtn = document.getElementById('btn-copy-pov');
        copyBtn.addEventListener('click', () => {
          const pov = {
            yaw: Number(yaw.toFixed(1)),
            pitch: Number(pitch.toFixed(1)),
            distance: Number(distance.toFixed(2)),
            target: [
              Number(target.x.toFixed(2)),
              Number(target.y.toFixed(2)),
              Number(target.z.toFixed(2))
            ]
          };
          navigator.clipboard?.writeText(JSON.stringify(pov));
          copyBtn.textContent = 'Copied POV!';
          setTimeout(() => { copyBtn.textContent = 'Copy POV'; }, 1800);
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement) {
            container.requestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
        });
      } catch (err) {
        spinner.style.display = 'none';
        statusTitle.textContent = 'Could not initialize 3D Gaussian Splat Viewer';
        statusSub.textContent = String(err?.message || err);
      }
    }
  </script>
</body>
</html>
